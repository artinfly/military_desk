{% extends "base.html" %}

{% block content %}
<div class="catalog">
    {% for title, refs in sections %}
    <section class="panel">
        <h2 class="panel-title">{{ title }}</h2>
        <ul class="catalog-list">
            {% for ref, count in refs %}
            <li>
                <a href="{% url 'references:list' ref.slug %}">{{ ref.title }}</a>
                <span class="muted">{{ count }}</span>
            </li>
            {% endfor %}
        </ul>
    </section>
    {% endfor %}
</div>
{% endblock %}
