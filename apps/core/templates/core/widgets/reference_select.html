<span class="reference-picker" data-picker-url="{{ widget.picker_url }}" data-picker-title="{{ widget.picker_title }}" data-picker-empty-label="{{ widget.picker_empty_label }}">
    <input type="hidden" name="{{ widget.name }}" value="{{ widget.picker_value }}"{% include "django/forms/widgets/attrs.html" %}>
    <button type="button" class="reference-trigger reference-picker-open"{% if widget.attrs.id %} id="{{ widget.attrs.id }}_display"{% endif %} aria-haspopup="dialog" aria-controls="reference-picker-dialog"{% if widget.attrs.disabled %} disabled{% endif %}>
        <span class="reference-picker-value" title="{{ widget.picker_value_label }}">{{ widget.picker_value_label }}</span>
        <span aria-hidden="true">⌄</span>
    </button>
    {% if not widget.picker_required %}<button type="button" class="btn btn-small reference-picker-clear" aria-label="Сбросить выбор {{ widget.picker_title }}"{% if not widget.picker_value %} hidden{% endif %}{% if widget.attrs.disabled %} disabled{% endif %}>×</button>{% endif %}
</span>
